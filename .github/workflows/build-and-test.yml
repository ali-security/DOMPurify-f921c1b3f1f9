name: Build and Test

# The event triggers are configured as following:
# - on `main` -> trigger the workflow on every push
# - on any pull request -> trigger the workflow
# This is to avoid running the workflow twice on pull requests.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'QUnit test-name filter (empty runs the full suite)'
        required: false
        default: ''

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        node-version: [16.x, 17.x, 18.x, 19.x, 20.x, 21.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        if: ${{ inputs.test-filter == '' }}
        uses: GabrielBB/xvfb-action@v1.6
        with:
          run: npm run test:ci
        env:
          TEST_BROWSERSTACK: ${{ startsWith(matrix.node-version, '21') }}
          TEST_PROBE_ONLY: ${{ github.ref != 'refs/heads/2.x' }}
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_ACCESSKEY: ${{ secrets.BS_ACCESSKEY }}
      - name: Test (filtered)
        if: ${{ inputs.test-filter != '' }}
        uses: GabrielBB/xvfb-action@v1.6
        with:
          run: npm run test:karma -- --single-run --browsers Firefox --client.qunit.filter "${{ inputs.test-filter }}"
      - name: Pack
        if: ${{ matrix.node-version == '18.x' }}
        run: npm pack
      - name: Upload package
        if: ${{ matrix.node-version == '18.x' }}
        uses: actions/upload-artifact@v4
        with:
          name: dompurify-tgz
          path: dompurify-*.tgz
          if-no-files-found: error
